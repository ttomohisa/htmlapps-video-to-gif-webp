name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "ffmpeg.config.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"
      - ".github/workflows/deploy-pages.yml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release package without publishing
        shell: bash
        run: |
          bash -n scripts/package-release-licenses.sh
          bash scripts/package-release-licenses.sh
          version="$(node -p "require('./app.config.json').version")"
          awk '/^## /{if(found)exit; if($0=="## v" version || $0=="## " version){found=1;next}} found' version="$version" CHANGELOG.md > release-notes.md
          test -s release-notes.md
