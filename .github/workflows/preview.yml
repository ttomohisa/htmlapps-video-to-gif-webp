# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Validate PowerShell syntax and encoding
      shell: pwsh
      run: |
        if (Test-Path -LiteralPath ".\scripts\check-powershell-syntax.ps1") {
          .\scripts\check-powershell-syntax.ps1
        } else {
          Write-Host "PowerShell syntax preflight is not present in this repository; continuing with the repository check."
        }
    - name: Build and verify standalone HTML
      shell: pwsh
      run: |
        ./scripts/check-repository.ps1
        node --test tests/mobile-layout.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Mobile layout source regression failed." }
    - name: Verify phone layout in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-layout-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path "test-results/mobile-layout" | Out-Null
        node scripts/mobile-layout.browser.cjs 2>&1 | Tee-Object -FilePath "test-results/mobile-layout/browser.log"
        if ($LASTEXITCODE -ne 0) { throw "Phone layout browser regression failed." }
    - name: Capture Big Buck Bunny documentation screenshots
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-layout-tests"
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        $sample = Join-Path $env:RUNNER_TEMP "BigBuckBunny.mp4"
        curl.exe --fail --location --retry 3 --max-time 90 "https://raw.githubusercontent.com/bower-media-samples/big-buck-bunny-480p-30s/b2fcfd503b8683b177fde855824096f05b89550d/video.mp4" --output $sample
        if ($LASTEXITCODE -ne 0) { throw "Big Buck Bunny download failed." }
        $hash = git hash-object --no-filters $sample
        if ($hash -ne "5c6336418e40573fc1229289f8f26d24a6d6024a") { throw "Sample integrity check failed." }
        node scripts/capture-readme.browser.cjs $sample
        if ($LASTEXITCODE -ne 0) { throw "Documentation screenshot capture failed." }
    - name: Upload documentation screenshot candidates
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: big-buck-bunny-readme-screenshots
        path: test-results/readme-screenshots/
        if-no-files-found: error
        retention-days: 7
    - name: Upload phone layout screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-layout-screenshots
        path: test-results/mobile-layout/
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
