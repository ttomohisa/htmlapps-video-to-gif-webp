name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Open **Actions**, select this workflow, and choose **Re-run all jobs**.

          This one-time repository setting cannot be enabled with the default `GITHUB_TOKEN`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Warning "GitHub Pages is not enabled. Deployment is skipped; see the workflow summary for setup steps."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish version tag and GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.sha }}
          path: dist
      - name: Publish release if version is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.config.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "::error::Existing release has no fetched tag: $tag"; exit 1
            fi
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Release $tag belongs to an earlier commit; leaving it unchanged."
              exit 0
            fi
          else
            rm -f existing-assets.txt
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            fi
          fi
          cp dist/index.html video-to-gif-webp.html
          cp dist/index.self-extract.html video-to-gif-webp.self-extract.html
          awk '/^## /{if(found)exit; if($0=="## v" version || $0=="## " version){found=1;next}} found' version="$version" CHANGELOG.md > release-notes.md
          test -s release-notes.md
          # Use the exact release archives already pinned and independently verified
          # by the application build and runtime provenance tests.
          builder="ttomohisa/htmlapps-ffmpeg-wasm-builder"
          mkdir -p upstream license-bundle
          gh release download v1.10.1 --repo "$builder" --dir upstream \
            --pattern ffmpeg-wasm-video-to-gif-v1.10.1.zip \
            --pattern ffmpeg-wasm-video-to-webp-v1.10.1.zip
          (
            cd upstream
            printf '%s\n' \
              'f165f455a6033998de55b0fdf55622199f5cadb8ed27e5af4e6285d1947b08f8  ffmpeg-wasm-video-to-gif-v1.10.1.zip' \
              'b37711ed8cb05a299ee865c676446e8c400686953ca8e837e43a58e6402dcae4  ffmpeg-wasm-video-to-webp-v1.10.1.zip' | sha256sum -c -
          )
          for profile in video-to-gif video-to-webp; do
            unzip -q "upstream/ffmpeg-wasm-${profile}-v1.10.1.zip" -d "upstream/$profile"
            mkdir -p "license-bundle/$profile"
            cp -R "upstream/$profile/LICENSES" "upstream/$profile/BUILDINFO.txt" "upstream/$profile/THIRD_PARTY_NOTICES.md" "license-bundle/$profile/"
            test -s "license-bundle/$profile/LICENSES/FFmpeg-COPYING.LGPLv2.1"
          done
          test -s license-bundle/video-to-webp/LICENSES/libwebp-COPYING
          cp LICENSE THIRD_PARTY_NOTICES.md license-bundle/
          printf '%s\n' 'Corresponding source (pinned Builder release):' 'https://github.com/ttomohisa/htmlapps-ffmpeg-wasm-builder/releases/download/v1.10.1/ffmpeg-wasm-sources-v1.10.1.tar.gz' > license-bundle/SOURCE.txt
          (cd license-bundle && zip -qr ../third-party-licenses.zip .)
          assets=(video-to-gif-webp.html video-to-gif-webp.self-extract.html dist/dependency-manifest.json dist/self-extract-manifest.json LICENSE THIRD_PARTY_NOTICES.md third-party-licenses.zip)
          if [[ -f existing-assets.txt ]]; then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq "$(basename "$asset")" existing-assets.txt; then
                gh release upload "$tag" "$asset"
              fi
            done
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md "${assets[@]}"
          fi
